name: Release

# Push a version tag (e.g. `git tag v0.15.0 && git push origin v0.15.0`) and this
# builds the TypeScript, packages the loadable zip, and attaches it to the Release.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::warning::Tag ($TAG) does not match manifest version ($VER)"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package Chrome/Edge zip
        run: |
          zip -r claude-companion-extension.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "dist/*" "*.zip"

      - name: Package Firefox zip
        run: |
          npm run pack:firefox
          ( cd dist/firefox && zip -r ../../claude-companion-firefox.zip . )

      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-companion-extension.zip
            claude-companion-firefox.zip
          fail_on_unmatched_files: true
