<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: Segoe UI, Arial, sans-serif; font-size: 13px; background: #0f1218; color: #e8e8e8; }
    header { padding: 10px 12px; border-bottom: 1px solid #222; }
    header .title { font-weight: 700; font-size: 14px; }
    header .mode { font-size: 11px; margin-top: 3px; }
    header a { color: #7fb0ff; cursor: pointer; float: right; font-size: 11px; text-decoration: none; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .g { background: #48c774; } .b { background: #3b82f6; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 11px; border-radius: 12px; max-width: 90%; white-space: pre-wrap; word-break: break-word; line-height: 1.35; }
    .me { align-self: flex-end; background: #1f4bd8; color: #fff; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: #1b2129; border: 1px solid #262d38; border-bottom-left-radius: 4px; }
    .sys { align-self: center; color: #8a93a3; font-size: 11px; }
    .blocked { color: #ff8a80; }
    .els { font-family: Consolas, monospace; font-size: 11px; color: #9fe6a0; }
    form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #222; }
    #inp { flex: 1; padding: 9px 11px; border-radius: 18px; border: 1px solid #333; background: #161b22; color: #e8e8e8; font-size: 13px; }
    button { padding: 9px 14px; border-radius: 18px; border: 0; background: #3b82f6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a id="policy">⚙ Policy</a>
    <div class="title">🤖 Claude Helper</div>
    <div class="mode" id="mode"><span class="dot b"></span>checking…</div>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="inp" placeholder="Type a command — e.g. open pinterest" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script src="sidepanel.js"></script>
</body>
</html>
