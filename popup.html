<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/popup.css" />
  </head>
  <body>
    <h1>Claude Companion — Browser Control</h1>
    <div class="sub">Type a site name, a URL, or a search — it auto-resolves.</div>

    <div class="row" id="searchWrap">
      <input id="url" placeholder="Search or site name — e.g. Pinterest" autocomplete="off" />
      <button class="act" id="open">Go</button>
      <div id="suggest"></div>
    </div>

    <div class="row">
      <button class="act" id="tabs">List tabs</button>
      <button class="act" id="read">Read page (get refs)</button>
    </div>
    <div class="row">
      <input id="ref" placeholder="ref # or CSS selector" />
      <button class="act" id="click">Click</button>
      <button class="act" id="submit">Submit</button>
    </div>
    <div class="row">
      <input id="text" placeholder="text to type" />
      <button class="act" id="type">Type into ref</button>
    </div>

    <div id="status" class="sub"></div>
    <div class="row"><button id="policy" style="flex:1;background:#fff3e0">⚙ Capabilities &amp; forbidden rules (Policy)</button></div>
    <pre id="out">Ready. Open a normal http/https page, then "Read page".</pre>
    <script type="module" src="js/popup.js"></script>
  </body>
</html>
